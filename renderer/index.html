<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悬浮歌词播放器</title>
  <link rel="stylesheet" href="all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="sky-blue">
  <!-- 播放器主体 -->
  <div class="player-container">
    <!-- 下载 -->
    <div id="download">
      <input id="url-input" placeholder="输入歌词或歌曲链接...">
      <button id="download-btn">下载</button>
    </div>
    <!-- 歌曲列表 -->
    <ul id="song-list"></ul>
    <!-- 歌曲进度条 -->
    <div id="progress">
      <input type="range" id="seek-bar" value="0" min="0" step="0.1" max="100">
      <div id="time-display">
        <span id="current-time">00:00</span>
        <span id="total-time">00:00</span>
      </div>
    </div>
    <!-- 播放器控件 -->
    <div id="controls">
      <button id="mode-btn" title="播放模式"><i class="fas fa-repeat"></i></button>
      <button id="prev-btn" title="上一首"><i class="fas fa-backward-step"></i></button>
      <button id="play-btn" title="播放/暂停"><i class="fas fa-play"></i></button>
      <button id="next-btn" title="下一首"><i class="fas fa-forward-step"></i></button>
      <button id="open-folder-btn" title="打开目录"><i class="fas fa-folder-open"></i></button>
    </div>
    <!-- 音量条 -->
    <div class="volume-container">
      <i class="fas fa-volume-low"></i>
      <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
      <i class="fas fa-volume-high"></i>
    </div>
    <!-- 主题 -->
    <div id="theme-selector">
      <i class="fas fa-palette"></i>
      <select id="theme-select">
        <option value="sky-blue">天空蓝</option>
        <option value="cyan-blue">水鸭蓝</option>
        <option value="amber">琥珀黄</option>
        <option value="raspberry-pink">深玫红</option>
        <option value="tomato-red">番茄红</option>
        <option value="hot-pink">桃粉红</option>
        <option value="lime">青柠绿</option>
        <option value="dark-teal-gray">深灰青</option>
      </select>
    </div>
    <audio id="audio" src=""></audio>
  </div>
  <script src="index.js"></script>
</body>
</html>
